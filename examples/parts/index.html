<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="page.title">Custom interface parts</title>
  <link rel="icon" href="data:,">
  <!-- Resolves the package names to the local sources of this checkout. An installed package uses its bundler or
       its own import map for the same names. -->
  <script type="importmap">
  { "imports": {
    "vibecharts": "../../src/index.js",
    "vibecharts/ui": "../../src/ui/index.js"
  } }
  </script>
  <link rel="stylesheet" href="../../src/styles/charting.css">
  <link rel="stylesheet" href="../../src/styles/ui.css">
  <link rel="stylesheet" href="./parts.css">
  <script type="module" src="./parts.js"></script>
</head>
<body>
  <header class="page-header">
    <h1 data-i18n="page.title"></h1>
    <div class="header-controls">
    <label><span data-i18n="mode.label"></span>
      <select id="mode">
        <option value="builtin" data-i18n="mode.builtin"></option>
        <option value="popover" selected data-i18n="mode.popover"></option>
        <option value="select" data-i18n="mode.select"></option>
      </select>
    </label>
    </div>
  </header>
  <main>
    <p class="data-notice" data-i18n="notice"></p>
    <div id="host" class="example-host" data-chart-ui-host></div>
    <pre id="layout" data-i18n-attr="aria-label:layout.label"></pre>
  </main>
</body>
</html>
