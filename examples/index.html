<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Synthetic chart examples</title></head>
<body>
  <main>
  <h1>Synthetic demonstration — not market data</h1>
  <label for="example">Example</label>
  <select id="example"><option value="static">Static history without time</option><option value="timed">Static history with time</option><option value="feed">Versioned local feed</option></select>
  <button id="mount" type="button">Mount</button><button id="remove" type="button">Remove and clean up</button>
  <p id="status" role="status" aria-live="polite"></p>
  <div id="host" style="width:100%"><div id="chart" style="width:100%;height:320px"></div></div>
  </main>
  <script type="module" src="./main.ts"></script>
</body>
</html>
